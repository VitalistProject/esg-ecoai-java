name: Deploy

# Reusable deploy: publishes the Docker image to GHCR and redeploys the Railway service
# of the given environment. The GitHub Environment of the same name must define the
# RAILWAY_TOKEN (project token for that Railway environment) and RAILWAY_SERVICE secrets.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and image tag to deploy (staging or production)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase image name, but the repository owner is mixed case.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.environment }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Redeploy on Railway
        run: npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
