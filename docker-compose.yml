services:
  db:
    image: postgres:16-alpine
    container_name: ecoal-db
    environment:
      POSTGRES_DB: ecoal
      POSTGRES_USER: ${DB_USER:?DB_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - ecoal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecoal"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ecoal-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER:?DB_USER is required, see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  ecoal_data:
