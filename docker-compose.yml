services:
  db:
    image: gvenzl/oracle-free:23-slim
    container_name: ecoal-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD is required, see .env.example}
      APP_USER: ${DB_USER:?DB_USER is required, see .env.example}
      APP_USER_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
    ports:
      - "1521:1521"
    volumes:
      - ecoal_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  app:
    build: .
    container_name: ecoal-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER:?DB_USER is required, see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  ecoal_data:
