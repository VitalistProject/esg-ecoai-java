services:
  db:
    image: gvenzl/oracle-free:23-slim
    container_name: ecoal-db
    environment:
      ORACLE_PASSWORD: ecoal
      APP_USER: ecoal
      APP_USER_PASSWORD: ecoal
    ports:
      - "1521:1521"
    volumes:
      - ecoal_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  app:
    build: .
    container_name: ecoal-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ecoal
      DB_PASSWORD: ecoal
      JWT_SECRET: ecoal-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  ecoal_data:
